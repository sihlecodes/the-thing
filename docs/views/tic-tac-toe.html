<link rel="stylesheet" href="main.css">

<style>
    #board {
        fill: #e6c9db;
    }

    .alternate-cell {
        fill: #fff;
    }

    .cross {
        stroke: red;
        stroke-width: 5%;
    }

    .circle {
        stroke: black;
        stroke-width: 5%;
    }
</style>

<svg id="canvas">
    <rect id="board" x="0" y="0" width="100%" height="100%" rx="5%" />
</svg>

<script>
    (function () {
        const canvas = document.getElementById('canvas');

        const width = window.innerWidth;
        const height = window.innerHeight;

        const boardSideLength = Math.min(width, height) * 0.85;

        canvas.setAttribute('width', boardSideLength);
        canvas.setAttribute('height', boardSideLength);

        const rows = 3;
        const columns = 3;
        const cellSideLength = boardSideLength / rows;

        for (let i = 1; i < rows * columns; i += 2) {
            const cell = document.createElementNS("http://www.w3.org/2000/svg", "rect");

            cell.setAttribute("class", "alternate-cell");
            cell.setAttribute("x", (i % columns) * cellSideLength);
            cell.setAttribute("y", Math.floor(i / columns) * cellSideLength);
            cell.setAttribute("width", cellSideLength);
            cell.setAttribute("height", cellSideLength);

            canvas.appendChild(cell);
        }

        let isGameOver = false;
        let turn = 0;

        const Symbols = {
            NONE: 0,
            X: 1,
            O: 2,
        };

        let board = [];

        for (let i = 0; i < rows; i++) {
            board.push([]);

            for (let j = 0; j < columns; j++)
                board[i].push(Symbols.NONE);
        }

        const computedStyle = window.getComputedStyle(document.documentElement);
        const crossColour = computedStyle.getPropertyValue('--cross-colour').trim();

        function drawCrossSymbol(x, y) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

            group.setAttribute("class", "cross");
            const computedStyle = window.getComputedStyle(group).getPropertyValue('stroke');

            const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");

            const strokeWidth = cellSideLength * 0.15;
            const padding = cellSideLength * 0.25;

            line1.setAttribute("x1", x * cellSideLength + padding);
            line1.setAttribute("y1", y * cellSideLength + padding);
            line1.setAttribute("x2", (x + 1) * cellSideLength - padding);
            line1.setAttribute("y2", (y + 1) * cellSideLength - padding);
            line1.setAttribute("stroke-width", strokeWidth);

            line2.setAttribute("x1", (x + 1) * cellSideLength - padding);
            line2.setAttribute("y1", y * cellSideLength + padding);
            line2.setAttribute("x2", x * cellSideLength + padding);
            line2.setAttribute("y2", (y + 1) * cellSideLength - padding);

            group.appendChild(line1);
            group.appendChild(line2);

            canvas.appendChild(group);
        }

        function drawCircleSymbol(x, y) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            const radius = cellSideLength * 0.25;

            circle.setAttribute("class", "circle");
            circle.setAttribute("cx", x * cellSideLength + cellSideLength / 2);
            circle.setAttribute("cy", y * cellSideLength + cellSideLength / 2);
            circle.setAttribute("r", radius);
            circle.setAttribute("fill", "none");

            canvas.appendChild(circle);
        }

        function checkWin(symbol) {
            for (let i = 0; i < rows; i++) {
                if (board[i][0] === symbol &&
                    board[i][1] === symbol &&
                    board[i][2] === symbol) {
                    return { result: true, startCoord: [0, i], endCoord: [2, i] };
                }

                if (board[0][i] === symbol &&
                    board[1][i] === symbol &&
                    board[2][i] === symbol) {
                    return { result: true, startCoord: [i, 0], endCoord: [i, 2] };
                }
            }

            if (board[0][0] === symbol &&
                board[1][1] === symbol &&
                board[2][2] === symbol) {
                return { result: true, startCoord: [0, 0], endCoord: [2, 2] };
            }

            if (board[0][2] === symbol &&
                board[1][1] === symbol &&
                board[2][0] === symbol) {
                return { result: true, startCoord: [2, 0], endCoord: [0, 2] };
            }

            return { result: false };
        }

        function placeSymbol(x, y, symbol) {
            if (symbol === Symbols.X)
                drawCrossSymbol(x, y);
            else
                drawCircleSymbol(x, y);

            board[y][x] = symbol;
        }

        function placeSymbolAndAdvanceTurn(x, y, symbol) {
            placeSymbol(x, y, symbol);
            turn++;
        }

        function playRulerAnimation(startCoord, endCoord, duration = 1000) {
            const [startX, startY] = startCoord;
            const [endX, endY] = endCoord;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX * cellSideLength + cellSideLength / 2);
            line.setAttribute("y1", startY * cellSideLength + cellSideLength / 2);
            line.setAttribute("x2", endX * cellSideLength + cellSideLength / 2);
            line.setAttribute("y2", endY * cellSideLength + cellSideLength / 2);
            line.setAttribute("stroke", "green");
            line.setAttribute("stroke-width", "5%");

            canvas.appendChild(line);

            return new Promise(resolve => {
                const start = performance.now();

                function animate(now) {
                    const t = Math.min((now - start) / duration, 1);
                    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                    const currentX = startX + (endX - startX) * ease;
                    const currentY = startY + (endY - startY) * ease;

                    line.setAttribute("x2", currentX * cellSideLength + cellSideLength / 2);
                    line.setAttribute("y2", currentY * cellSideLength + cellSideLength / 2);

                    if (t < 1)
                        return requestAnimationFrame(animate);

                    resolve();
                }

                requestAnimationFrame(animate);
            });
        }

        function computeAIMove() {
            const availableMoves = [];

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < columns; x++) {
                    if (board[y][x] === Symbols.NONE)
                        availableMoves.push([x, y]);
                }
            }

            const badMoves = availableMoves.filter(([x, y]) => !checkIfGoodMove(x, y));

            // intentionally make bad moves
            if (badMoves.length > 0)
                return badMoves[Math.floor(Math.random() * badMoves.length)];

            return availableMoves[Math.floor(Math.random() * availableMoves.length)];
        }

        function checkIfGoodMove(x, y) {
            board[y][x] = Symbols.X;
            const aiResult = checkWin(Symbols.X).result;
            board[y][x] = Symbols.NONE;

            board[y][x] = Symbols.O;
            const playerResult = checkWin(Symbols.O).result;
            board[y][x] = Symbols.NONE;

            return aiResult || playerResult;
        }

        const aiSymbol = Symbols.X;
        const playerSymbol = Symbols.O;

        canvas.addEventListener('click', async (event) => {
            if (isGameOver) {
                console.log('Game is over. Please refresh to play again.');
                return;
            }

            const x = event.offsetX;
            const y = event.offsetY;

            const cellX = Math.floor(x / cellSideLength);
            const cellY = Math.floor(y / cellSideLength);

            console.log(`Clicked on cell: (${cellX}, ${cellY})`);

            if (board[cellY][cellX] !== Symbols.NONE) {
                console.log('Cell already occupied!');
                return;
            }

            placeSymbolAndAdvanceTurn(cellX, cellY, playerSymbol);

            let { result: playerMoveResult, startCoord, endCoord } = checkWin(playerSymbol);
            let aiMoveResult = false;

            if (!playerMoveResult && turn < rows * columns) {
                placeSymbolAndAdvanceTurn(...computeAIMove(), aiSymbol);
                ({ result: aiMoveResult, startCoord, endCoord } = checkWin(aiSymbol));
            }

            const holdDuration = 300;

            if (playerMoveResult) {
                console.log(`Player wins!`);
                isGameOver = true;

                let { startCoord, endCoord } = checkWin(playerSymbol);

                if (cellX === startCoord[0] && cellY === startCoord[1])
                    [startCoord, endCoord] = [endCoord, startCoord];

                await playRulerAnimation(startCoord, endCoord, 600);
                getNextState(States.TTT_WON, holdDuration);
            }

            else if (aiMoveResult) {
                console.log(`AI wins!`);
                isGameOver = true;

                const { startCoord, endCoord } = checkWin(aiSymbol);
                await playRulerAnimation(startCoord, endCoord);
                getNextState(States.TTT_LOST, holdDuration
                );
            }

            else if (turn >= rows * columns) {
                isGameOver = true;

                getNextState(States.TTT_DRAW, holdDuration);
            }
        });

        // make opening move
        placeSymbolAndAdvanceTurn(...computeAIMove(), aiSymbol);
    })();
</script>
