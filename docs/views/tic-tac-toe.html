<style>
    #board {
        fill: #e6c9db;
    }
</style>

<svg id="canvas">
    <rect id="board" x="0" y="0" width="100%" rx="5%" height="100%"/>
</svg>

<script>
    const canvas = document.getElementById('canvas');

    const width = window.innerWidth;
    const height = window.innerHeight;

    const boardSideLength = Math.min(width, height) * 0.8;

    canvas.setAttribute('width', boardSideLength);
    canvas.setAttribute('height', boardSideLength);

    const cellSideLength = boardSideLength / 3;

    for (let i = 1; i < 9; i+=2) {
        const cell = document.createElementNS("http://www.w3.org/2000/svg", "rect");

        cell.setAttribute("x", (i % 3) * cellSideLength);
        cell.setAttribute("y", Math.floor(i / 3) * cellSideLength);
        cell.setAttribute("width", cellSideLength);
        cell.setAttribute("height", cellSideLength);
        cell.setAttribute("fill", "#ffffff");

        canvas.appendChild(cell);
    }

    let turn = 0;
    let board = [
        [null, null, null],
        [null, null, null],
        [null, null, null]
    ];

    function createCrossSymbol(x, y) {
        const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");

        const stroke = "#000000";
        const strokeWidth = cellSideLength * 0.15;

        line1.setAttribute("x1", x * cellSideLength + cellSideLength * 0.2);
        line1.setAttribute("y1", y * cellSideLength + cellSideLength * 0.2);
        line1.setAttribute("x2", (x + 1) * cellSideLength - cellSideLength * 0.2);
        line1.setAttribute("y2", (y + 1) * cellSideLength - cellSideLength * 0.2);
        line1.setAttribute("stroke", stroke);
        line1.setAttribute("stroke-width", strokeWidth);

        line2.setAttribute("x1", (x + 1) * cellSideLength - cellSideLength * 0.2);
        line2.setAttribute("y1", y * cellSideLength + cellSideLength * 0.2);
        line2.setAttribute("x2", x * cellSideLength + cellSideLength * 0.2);
        line2.setAttribute("y2", (y + 1) * cellSideLength - cellSideLength * 0.2);
        line2.setAttribute("stroke", stroke);
        line2.setAttribute("stroke-width", strokeWidth);

        canvas.appendChild(line1);
        canvas.appendChild(line2);
    }

    function createCircleSymbol(x, y) {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");

        const stroke = "#000000";
        const strokeWidth = cellSideLength * 0.15;
        const radius = cellSideLength * 0.3;

        circle.setAttribute("cx", x * cellSideLength + cellSideLength / 2);
        circle.setAttribute("cy", y * cellSideLength + cellSideLength / 2);
        circle.setAttribute("r", radius);
        circle.setAttribute("stroke", stroke);
        circle.setAttribute("stroke-width", strokeWidth);
        circle.setAttribute("fill", "none");

        canvas.appendChild(circle);
    }

    function placeSymbol(x, y, symbol) {
        if (symbol === 'X') {
            createCrossSymbol(x, y);
        } else {
            createCircleSymbol(x, y);
        }
        board[y][x] = symbol;
    }

    canvas.addEventListener('click', (event) => {
        const x = event.offsetX;
        const y = event.offsetY;

        const cellX = Math.floor(x / cellSideLength);
        const cellY = Math.floor(y / cellSideLength);

        console.log(`Clicked on cell: (${cellX}, ${cellY})`);

        if (board[cellY][cellX] !== null) {
            console.log('Cell already occupied!');
            return;
        }

        console.log(`Placing: ${turn % 2 === 0 ? 'X' : 'O'}`);
        placeSymbol(cellX, cellY, turn % 2 === 0 ? 'X' : 'O');
        turn++;

        canvas
    });
</script>
