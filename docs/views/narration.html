<style>
    .hint {
        position: absolute;
        bottom: 20px;
        font-size: .9em;
        color: #888;
    }
</style>

<h1></h1>
<h2></h2>

<span id="hint" class="hint">Tap and hold the screen to continue</span>

<svg width="100" height="100" viewBox="0 0 100 100" style="position: absolute; top: -10vw;">
    <path id="loader" fill="none" stroke="#e98ea683" stroke-width="12" stroke-linecap="round">
    </path>
</svg>

<script>
    if (typeof narration === 'undefined') {
        let touchStartHandler = null;
        let touchMoveHandler = null;
        let touchEndHandler = null;

        var narration = {
            callback: null,

            setHeading: function (heading) {
                document.querySelector('h1').textContent = heading;
            },
            setMessage: function (message) {
                document.querySelector('h2').textContent = message;
            },
            setCallback: function (callback) {
                this.callback = callback;
                this.enableCallback();
            },

            enableCallback: function () {
                touchStartHandler = (event) => {
                    event.preventDefault();
                    handleMouseDown(event.touches[0]);
                };

                touchMoveHandler = (event) => {
                    event.preventDefault();
                    handleMouseMove(event.touches[0]);
                };

                touchEndHandler = (event) => {
                    event.preventDefault();
                    handleMouseUp();
                };

                document.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('touchstart', touchStartHandler, { passive: false });

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('touchmove', touchMoveHandler, { passive: false });

                document.addEventListener('mouseup', handleMouseUp);
                document.addEventListener('touchend', touchEndHandler, { passive: false });
            },
        };

        let callbackActivated;
        let activationTimerId;
        let loaderIntervalId;

        const startAngle = 3 * Math.PI / 2;

        function updateLoaderProgress(cx, cy, radius, completion) {
            const endAngle = startAngle + (completion) * 2 * Math.PI;

            const startX = cx + radius * Math.cos(startAngle);
            const startY = cy + radius * Math.sin(startAngle);
            const endX = cx + radius * Math.cos(endAngle);
            const endY = cy + radius * Math.sin(endAngle);

            const angleDiff = Math.abs(endAngle - startAngle);
            const largeArcFlag = angleDiff > Math.PI ? 1 : 0;

            const pathData = `M ${startX} ${startY} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${endX} ${endY}`;
            document.querySelector('#loader').setAttribute('d', pathData);
        }

        function handleMouseDown(event) {
            callbackActivated = false;
            activationTimerId = null;
            loaderIntervalId = null;

            const loaderContainer = document.getElementById('loader').parentElement;
            const containerRect = loaderContainer.getBoundingClientRect();

            loaderContainer.style.left = `${event.clientX - containerRect.width/2}px`;
            loaderContainer.style.top = `${event.clientY - containerRect.height/2}px`;

            let progress = 0;

            const start = performance.now();
            const duration = 1000;

            if (narration.callback) {
                activationTimerId = setTimeout(() => {
                    callbackActivated = true;
                    clearInterval(loaderIntervalId);
                    console.log("Callback activated");
                    document.getElementById('hint').textContent = "You can let go now :D";
                }, duration);

                loaderIntervalId = setInterval(() => {
                    console.log("Loading...");
                    const loader = document.getElementById('loader');
                    const now = performance.now();

                    progress = Math.min((now - start) / duration, 0.99);
                    updateLoaderProgress(containerRect.width/2, containerRect.height/2, 40, progress);
                }, 10);
            }
        }

        function handleMouseMove(event) {
            const loaderContainer = document.getElementById('loader').parentElement;
            const containerRect = loaderContainer.getBoundingClientRect();

            loaderContainer.style.left = `${event.clientX - containerRect.width/2}px`;
            loaderContainer.style.top = `${event.clientY - containerRect.height/2}px`;
        }

        function handleMouseUp() {
            clearTimeout(activationTimerId);
            clearInterval(loaderIntervalId);

            const loader = document.getElementById('loader');

            if (loader)
                loader.parentElement.style.left = '-10vw';

            if (narration.callback && callbackActivated) {
                console.log('callback activated, cleaning up');
                document.removeEventListener('mousedown', handleMouseDown);
                document.removeEventListener('touchstart', touchStartHandler);
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('touchmove', touchMoveHandler);
                document.removeEventListener('mouseup', handleMouseUp);
                document.removeEventListener('touchend', touchEndHandler);

                narration.callback();
                narration.callback = null;
                touchStartHandler = null;
                touchMoveHandler = null;
                touchEndHandler = null;
            }

            loader.removeAttribute('d');
        }
    }
</script>
