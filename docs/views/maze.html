<style>
    #board {
        fill: #e6c9db;
        stroke: black;
        stroke-width: 5px;
        rx: 3%;
    }

    .wall {
        fill: black;
        stroke: black;
    }
</style>

<svg id="canvas">
    <rect id="board" />
</svg>

<script>
    (function () {
        const canvas = document.getElementById('canvas');

        const width = window.innerWidth;
        const height = window.innerHeight;

        const canvasSideLength = Math.min(width, height) * 0.85;

        canvas.setAttribute('width', canvasSideLength);
        canvas.setAttribute('height', canvasSideLength);

        const board = document.getElementById('board');
        const boardOffset = window.getComputedStyle(board).getPropertyValue('stroke-width').replace('px', '') * 1;

        const boardSideLength = canvasSideLength - boardOffset * 2;

        board.setAttribute('x', boardOffset);
        board.setAttribute('y', boardOffset);
        board.setAttribute('width', boardSideLength);
        board.setAttribute('height', boardSideLength);

        const NONE = 0;
        const LEFT = 1;
        const RIGHT = 2;
        const TOP = 4;
        const BOTTOM = 8;

        // Implement this
        const DUPLICATE = 16;
        const START = 32;
        const GOAL = 64;
        const PATH = 128;

        let maze = [
            [NONE, BOTTOM, NONE],
            [NONE, RIGHT, LEFT],
            [NONE | START, NONE, LEFT | GOAL],
        ];

        const rows = maze.length;
        const columns = maze[0].length;

        const cellWidth = boardSideLength / columns;
        const cellHeight = boardSideLength / rows;

        const has = (cell, boundary) => (cell & boundary) !== 0;

        function toFullyDefinedMaze(maze) {
            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    const cellProperties = maze[y][x];

                    if (has(cellProperties, LEFT) && x > 0) {
                        maze[y][x - 1] |= RIGHT;
                    }

                    if (has(cellProperties, RIGHT) && x < maze[y].length - 1) {
                        maze[y][x + 1] |= LEFT;
                    }

                    if (has(cellProperties, TOP) && y > 0) {
                        maze[y - 1][x] |= BOTTOM;
                    }

                    if (has(cellProperties, BOTTOM) && y < maze.length - 1) {
                        maze[y + 1][x] |= TOP;
                    }
                }
            }
        }

        function drawLine(x1, y1, x2, y2, { stroke = 'black', strokeWidth = '.2em', group = null } = {}) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', stroke);
            line.setAttribute('stroke-width', strokeWidth);
            line.setAttribute('stroke-linecap', 'round');

            if (group !== null)
                group.appendChild(line);
            else
                canvas.appendChild(line);
        }

        let goalCircle = null;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < columns; x++) {
                const cellProperties = maze[y][x];

                const cellLeft = boardOffset + cellWidth * x;
                const cellRight = cellLeft + cellWidth;
                const cellTop = boardOffset + cellHeight * y;
                const cellBottom = cellTop + cellHeight;

                if (has(cellProperties, LEFT))
                    drawLine(cellLeft, cellTop, cellLeft, cellBottom);

                if (has(cellProperties, RIGHT))
                    drawLine(cellRight, cellTop, cellRight, cellBottom);

                if (has(cellProperties, TOP))
                    drawLine(cellLeft, cellTop, cellRight, cellTop);

                if (has(cellProperties, BOTTOM))
                    drawLine(cellLeft, cellBottom, cellRight, cellBottom);

                if (has(cellProperties, START)) {
                    const startCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    startCircle.setAttribute('cx', cellLeft + cellWidth / 2);
                    startCircle.setAttribute('cy', cellTop + cellHeight / 2);
                    startCircle.setAttribute('r', Math.min(cellWidth, cellHeight) / 4);
                    startCircle.setAttribute('fill', 'mediumslateblue');
                    canvas.appendChild(startCircle);
                }

                if (has(cellProperties, GOAL)) {
                    goalCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    goalCircle.setAttribute('cx', cellLeft + cellWidth / 2);
                    goalCircle.setAttribute('cy', cellTop + cellHeight / 2);
                    goalCircle.setAttribute('r', Math.min(cellWidth, cellHeight) / 4);
                    goalCircle.setAttribute('fill', 'gray');
                    canvas.appendChild(goalCircle);
                }
            }
        }

        toFullyDefinedMaze(maze);

        function cellToString(cell) {
            const properties = maze[cell.y][cell.x];

            let result = '[';

            if (has(properties, LEFT)) result += 'L';
            else result += ' ';
            if (has(properties, RIGHT)) result += 'R';
            else result += ' ';
            if (has(properties, TOP)) result += 'T';
            else result += ' ';
            if (has(properties, BOTTOM)) result += 'B';
            else result += ' ';
            if (has(properties, START)) result += 'S';
            else result += ' ';
            if (has(properties, GOAL)) result += 'G';
            else result += ' ';
            if (has(properties, PATH)) result += 'P';
            else result += ' ';

            return result + ']';
        }

        function debugMaze(maze) {
            for (let y = 0; y < maze.length; y++) {
                let rowString = '';
                for (let x = 0; x < maze[y].length; x++) {
                    const properties = maze[y][x];
                    const cellString = cellToString({ x, y });
                    rowString += cellString;
                }
                console.log(rowString);
            }
        }

        debugMaze(maze);

        function debugCell(cell) {
            const properties = maze[cell.y][cell.x];
            console.log(`Cell (${cell.x}, ${cell.y}): ${cellToString(cell)}`);
        }

        function getCellFromCoordinates(x, y) {
            const cellX = Math.floor(x / cellWidth);
            const cellY = Math.floor(y / cellHeight);

            if (cellX >= 0 && cellX < columns && cellY >= 0 && cellY < rows) {
                return { x: cellX, y: cellY };
            } else {
                return null;
            }
        }

        function getIndexFromCell(cell) {
            return cell.y * columns + cell.x;
        }

        function getCellFromIndex(index) {
            return { x: index % columns, y: Math.floor(index / columns) };
        }

        let isDragging = false;
        let isValidDrag = true;
        let previousCellIndex = null;
        let currentCellIndex = null;
        let lastValidCellIndex = null;
        let mazeComplete = false;
        let indexesAlongPath = [];

        const pathGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        canvas.appendChild(pathGroup);

        function onMouseDown(event) {
            const rect = board.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const cell = getCellFromCoordinates(x, y);
            const cellProperties = cell ? maze[cell.y][cell.x] : 0;

            if (!cell)
                return;

            const cellIndex = getIndexFromCell(cell);
            const isStart = has(cellProperties, START);

            if (isStart && !pathGroup.hasChildNodes() ||
                has(cellProperties, PATH) &&
                indexesAlongPath[indexesAlongPath.length - 1] === cellIndex)
            {
                if (has(cellProperties, START))
                    maze[cell.y][cell.x] |= PATH;

                console.log(`Dragging started on cell: (${cell.x}, ${cell.y})`);
                isDragging = true;
                currentCellIndex = getIndexFromCell(cell);
                previousCellIndex = currentCellIndex;
            }
        }

        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('touchstart', (event) => {
            event.preventDefault();
            const touch = event.touches[0];
            onMouseDown(touch);
        }, { passive: false });

        function onMouseMove(event) {
            if (mazeComplete || !isDragging)
                return;

            const rect = board.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const currentCell = getCellFromCoordinates(x, y);

            let isBacktracking;

            if (!currentCell)
                return;

            const newCurrentCellIndex = getIndexFromCell(currentCell);

            if (newCurrentCellIndex === currentCellIndex)
                return;

            isBacktracking = has(maze[currentCell.y][currentCell.x], PATH);

            if (isBacktracking) {
                console.log('Backtracking detected');
            }

            previousCellIndex = currentCellIndex;
            currentCellIndex = newCurrentCellIndex;

            if (!isValidDrag) {
                if (currentCellIndex !== lastValidCellIndex) {
                    if (currentCellIndex !== previousCellIndex)
                        console.log('Invalid drag: Previous drag was invalid, ignoring further drags');

                    return;
                }

                console.log('valid again!');
                isValidDrag = true;
                previousCellIndex = lastValidCellIndex;
            }

            if (previousCellIndex !== currentCellIndex) {
                const previousCell = getCellFromIndex(previousCellIndex);

                console.log('Previous cell:');
                debugCell(previousCell);

                console.log('Current cell:');
                debugCell(currentCell);

                if (Math.abs(previousCell.x - currentCell.x) + Math.abs(previousCell.y - currentCell.y) !== 1) {
                    isValidDrag = false;
                    lastValidCellIndex = previousCellIndex;
                    return;

                }

                const previousCellProperties = maze[previousCell.y][previousCell.x];
                const currentCellProperties = maze[currentCell.y][currentCell.x];

                if (pathGroup.childNodes.length > 1 && has(currentCellProperties, START)) {
                    isValidDrag = false;
                    lastValidCellIndex = previousCellIndex;
                    return;
                }

                if (isBacktracking) {
                    maze[previousCell.y][previousCell.x] &= ~PATH;

                    pathGroup.removeChild(pathGroup.lastChild);
                    indexesAlongPath.pop();
                }

                if ((previousCell.x < currentCell.x && has(previousCellProperties, RIGHT)) ||
                    (previousCell.x > currentCell.x && has(previousCellProperties, LEFT)) ||
                    (previousCell.y < currentCell.y && has(previousCellProperties, BOTTOM)) ||
                    (previousCell.y > currentCell.y && has(previousCellProperties, TOP))) {
                    isValidDrag = false;
                    lastValidCellIndex = previousCellIndex;
                    return;
                }

                if (isBacktracking)
                    return;

                const previousCellCenterX = boardOffset + previousCell.x * cellWidth + cellWidth / 2;
                const previousCellCenterY = boardOffset + previousCell.y * cellHeight + cellHeight / 2;

                const currentCellCenterX = boardOffset + currentCell.x * cellWidth + cellWidth / 2;
                const currentCellCenterY = boardOffset + currentCell.y * cellHeight + cellHeight / 2;

                drawLine(
                    previousCellCenterX, previousCellCenterY,
                    currentCellCenterX, currentCellCenterY,
                    {
                        stroke: isValidDrag ? 'mediumslateblue' : 'red',
                        strokeWidth: '8%',
                        group: pathGroup
                    }
                );

                indexesAlongPath.push(currentCellIndex);
                maze[currentCell.y][currentCell.x] |= PATH;

                if (has(currentCellProperties, GOAL)) {
                    goalCircle.setAttribute('fill', 'mediumslateblue');
                    console.log('Goal reached!');
                    mazeComplete = true;
                }
            }
        }

        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('touchmove', (event) => {
            event.preventDefault();
            const touch = event.touches[0];
            onMouseMove(touch);
        }, { passive: false });

        function onMouseUp(event) {
            const currentCell = getCellFromIndex(currentCellIndex);
            const cellProperties = maze[currentCell.y][currentCell.x];

            if (mazeComplete) {
                console.log('Maze completed!');
                getNextState(States.MAZE_COMPLETE);
            }

            isDragging = false;
            isValidDrag = true;
            previousCellIndex = null;
            currentCellIndex = null;
            console.log('Dragging stopped');
        }

        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('touchend', (event) => {
            event.preventDefault();
            onMouseUp(event.changedTouches[0]);
        }, { passive: false });
    })();
</script>
