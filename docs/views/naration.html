<style>
    .hint {
        position: absolute;
        bottom: 20px;
        font-size: .9em;
        color: #888;
    }
</style>

<h1></h1>
<h2></h2>

<!-- TODO: implement tap and hold -->
<span class="hint">tap the screen to continue</span>

<script>
    if (typeof naration === 'undefined') {
        var naration = {
            setHeading: function (heading) {
                document.querySelector('h1').textContent = heading;
            },
            setMessage: function (message) {
                document.querySelector('h2').textContent = message;
            },
            setCallback: function (callback) {
                document.addEventListener('click', callback, { once: true });
            }
        };
    }
</script>
